<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 2 - Psevdosiniflər</title>
    <style>
        ul li:first-child {
            color: teal;
        }

        ul li:nth-child(2) {
            color: red;
        }

        ul li:last-child {
            color: green;
        }

        ul li:hover {
            color: purple;
        }
    </style>
</head>
<body>

    <!-- Beş addan ibarət sıralanmamış siyahı -->
    <ul>
        <li>Martin</li>
        <li>Gary</li>
        <li>Tim</li>
        <li>Lary</li>
        <li>July</li>
    </ul>

</body>
</html>
